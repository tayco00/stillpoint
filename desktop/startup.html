<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stillpoint</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f1f0e8;
        color: #151512;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 88% 15%, rgba(216, 255, 79, 0.72), transparent 34%),
          linear-gradient(145deg, #faf9f3 0%, #f1f0e8 64%, #e9e7dd 100%);
        -webkit-app-region: drag;
      }

      main {
        width: 100%;
        padding: 34px 38px 30px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 38px;
        font-size: 12px;
        font-weight: 760;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .mark {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #e64b31;
        box-shadow: 0 0 0 6px rgba(230, 75, 49, 0.12);
      }

      h1 {
        margin: 0;
        max-width: 360px;
        font-size: clamp(27px, 7vw, 34px);
        line-height: 1.02;
        letter-spacing: -0.045em;
      }

      .detail {
        min-height: 48px;
        margin: 13px 0 24px;
        color: #55554f;
        font-size: 14px;
        line-height: 1.55;
      }

      .progress {
        position: relative;
        height: 7px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(21, 21, 18, 0.12);
      }

      .progress-fill {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: #151512;
        transition: width 240ms ease;
      }

      .progress.indeterminate .progress-fill {
        width: 42%;
        animation: search 1.35s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 40px;
        margin-top: 18px;
      }

      .percent {
        color: #55554f;
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        font-weight: 700;
      }

      button {
        min-height: 40px;
        border: 1px solid rgba(21, 21, 18, 0.42);
        border-radius: 999px;
        padding: 0 17px;
        background: rgba(250, 249, 243, 0.72);
        color: #151512;
        font: inherit;
        font-size: 12px;
        font-weight: 720;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }

      button:hover { background: #ffffff; }
      button:focus-visible { outline: 3px solid #6d2cf6; outline-offset: 3px; }

      @keyframes search {
        from { transform: translateX(-120%); }
        to { transform: translateX(340%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress-fill { transition: none; }
        .progress.indeterminate .progress-fill { animation: none; width: 100%; opacity: 0.45; }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="startup-title">
      <p class="brand"><span class="mark" aria-hidden="true"></span>Stillpoint</p>
      <h1 id="startup-title">Stillpoint startet</h1>
      <p class="detail" id="startup-detail" aria-live="polite">Wir prüfen kurz, ob eine neue Version bereitsteht.</p>
      <div class="progress indeterminate" id="startup-progress" role="progressbar" aria-label="Updatefortschritt">
        <div class="progress-fill"></div>
      </div>
      <div class="footer">
        <span class="percent" id="startup-percent" aria-hidden="true">Updateprüfung</span>
        <button id="startup-skip" type="button">Ohne Update starten</button>
      </div>
    </main>
    <script src="./startup-renderer.js"></script>
  </body>
</html>
